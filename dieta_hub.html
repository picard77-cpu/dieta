<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dieta</title>
<style>
  :root{--bg:#f4f0e8;--surface:#ede8de;--surface2:#e5dfd3;--border:#d5cfc3;--text:#2a2a24;--text-muted:#5a5a50;--text-dim:#9a9a8a;--check:#5a7a5a;--r:12px;--rs:8px;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px;line-height:1.5;min-height:100vh;padding-bottom:40px;}
  .hdr{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 16px 10px;}
  .hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .app-title{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);}
  .reset-btn{background:none;border:1px solid var(--border);color:var(--text-muted);font-size:12px;padding:4px 12px;border-radius:20px;cursor:pointer;font-family:inherit;}
  .day-sel{display:flex;gap:6px;}
  .day-btn{flex:1;padding:7px 4px;border-radius:var(--rs);border:1px solid var(--border);background:var(--surface);color:var(--text-muted);font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;text-align:center;}
  .day-btn.on{background:rgba(90,122,90,.15);border-color:#5a7a5a;color:#3d5c3d;}
  .day-btn.off{background:rgba(74,122,181,.15);border-color:#4a7ab5;color:#2d5a8a;}
  .day-btn.sc{background:rgba(196,122,58,.15);border-color:#c47a3a;color:#8a4a1a;}
  .totali{padding:10px 16px;border-bottom:1px solid var(--border);}
  .totali-row{display:flex;gap:6px;}
  .tot-card{flex:1;background:var(--surface);border-radius:var(--rs);padding:8px 4px;text-align:center;}
  .tot-val{font-size:17px;font-weight:700;color:var(--text);line-height:1.1;}
  .tot-val.over{color:#b5502d;}
  .tot-lbl{font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);margin-top:2px;}
  .tot-target{font-size:9px;color:var(--text-dim);margin-top:1px;}
  .prog-wrap{display:flex;align-items:center;gap:10px;padding:8px 16px 0;}
  .prog-bar{flex:1;height:3px;background:var(--border);border-radius:3px;overflow:hidden;}
  .prog-fill{height:100%;background:#5a7a5a;border-radius:3px;transition:width .3s;}
  .prog-lbl{font-size:11px;color:var(--text-dim);white-space:nowrap;}
  .content{padding:0 16px;}
  .meal-sec{margin-top:18px;}
  .meal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;}
  .meal-lbl{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:5px 11px;border-radius:20px;display:inline-block;white-space:nowrap;}
  .meal-lbl.colazione,.meal-lbl.pranzo,.meal-lbl.cena{background:rgba(90,122,90,.12);color:#3d5c3d;}
  .meal-lbl.spuntino,.meal-lbl.merenda{background:rgba(74,122,181,.12);color:#2d5a8a;}
  .meal-lbl.serale{background:rgba(196,122,58,.12);color:#8a4a1a;}
  .meal-sub{font-size:10px;color:var(--text-dim);font-weight:600;text-align:right;}
  .meal-sub b{color:var(--text-muted);}
  .sec-note{font-size:12px;color:var(--text-dim);margin-bottom:8px;font-style:italic;}
  .divider{height:1px;background:var(--border);margin:18px 0 2px;}
  .alt-tabs{display:flex;gap:6px;margin-bottom:10px;}
  .alt-tab{font-size:11px;font-weight:600;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);cursor:pointer;font-family:inherit;}
  .alt-tab.sel{border-color:#7a9a7a;background:rgba(90,122,90,.12);color:#3d5c3d;}
  .cat-block{margin-bottom:12px;}
  .cat-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin-bottom:5px;padding-left:2px;}
  .opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;margin-bottom:4px;border-radius:var(--rs);border:1px solid var(--border);background:var(--surface);cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .opt.ck{background:rgba(90,122,90,.14);border-color:#9ab89a;}
  .opt-circle{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--text-dim);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;}
  .opt.ck .opt-circle{background:var(--check);border-color:var(--check);}
  .opt.ck .opt-circle::after{content:'';width:5px;height:9px;border:2px solid #f4f0e8;border-top:none;border-left:none;transform:rotate(45deg) translateY(-1px);display:block;}
  .opt-text{font-size:14px;color:var(--text-muted);flex:1;line-height:1.4;}
  .opt.ck .opt-text{color:var(--text);}
  .opt-macros{font-size:11px;color:var(--text-dim);margin-top:3px;}
  .stepper{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .step-btn{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--bg);color:var(--text-muted);font-size:16px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .step-val{font-size:13px;color:var(--text);font-weight:600;min-width:60px;text-align:center;}
  .sub-list{margin-top:6px;margin-left:4px;display:flex;flex-direction:column;gap:3px;}
  .sub{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:6px;border:1px solid #c8c2b6;background:rgba(255,255,255,.4);cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .sub.ck{background:rgba(90,122,90,.1);border-color:#9ab89a;}
  .sub-box{width:15px;height:15px;border-radius:3px;border:1.5px solid var(--text-dim);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .sub.ck .sub-box{background:var(--check);border-color:var(--check);}
  .sub.ck .sub-box::after{content:'';width:4px;height:7px;border:1.5px solid #f4f0e8;border-top:none;border-left:none;transform:rotate(45deg) translateY(-1px);display:block;}
  .sub-txt{font-size:13px;color:var(--text-muted);flex:1;}
  .sub.ck .sub-txt{color:var(--text);}
  .sub-macros{font-size:10px;color:var(--text-dim);}
  .fix{display:flex;align-items:flex-start;gap:10px;padding:8px 12px;margin-bottom:4px;border-radius:var(--rs);border:1px dashed var(--border);background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .fix.ck{border-color:#9ab89a;background:rgba(90,122,90,.08);}
  .fix-box{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--text-dim);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;}
  .fix.ck .fix-box{background:#9ab89a;border-color:#7a9a7a;}
  .fix.ck .fix-box::after{content:'';width:5px;height:9px;border:2px solid #f4f0e8;border-top:none;border-left:none;transform:rotate(45deg) translateY(-1px);display:block;}
  .fix-txt{font-size:13px;color:var(--text-dim);flex:1;line-height:1.4;}
  .fix.ck .fix-txt{color:var(--text-muted);}
  .fix-macros{font-size:10px;color:var(--text-dim);margin-top:2px;}
  /* multi-gram items (verdure/frutta/legumi) */
  .mg{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-bottom:4px;border-radius:var(--rs);border:1px solid var(--border);background:var(--surface);-webkit-tap-highlight-color:transparent;}
  .mg.ck{background:rgba(90,122,90,.12);border-color:#9ab89a;}
  .mg-box{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--text-dim);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .mg.ck .mg-box{background:var(--check);border-color:var(--check);}
  .mg.ck .mg-box::after{content:'';width:5px;height:9px;border:2px solid #f4f0e8;border-top:none;border-left:none;transform:rotate(45deg) translateY(-1px);display:block;}
  .mg-name{font-size:14px;color:var(--text-muted);flex:1;cursor:pointer;}
  .mg.ck .mg-name{color:var(--text);}
  .mg-gr{display:flex;align-items:center;gap:3px;border:1px solid var(--border);border-radius:6px;background:var(--bg);padding:3px 6px;}
  .mg-input{border:none;background:transparent;font-family:inherit;font-size:14px;font-weight:600;color:var(--text);width:46px;text-align:right;outline:none;}
  .mg-unit{font-size:11px;color:var(--text-dim);}
  .mg-macros{font-size:10px;color:var(--text-dim);min-width:54px;text-align:right;}
  .pw-badge{font-size:10px;font-weight:700;letter-spacing:.08em;color:#8a4a1a;background:rgba(196,122,58,.12);padding:2px 7px;border-radius:10px;display:inline-block;margin-bottom:4px;}
  .acqua{margin:22px 16px 8px;padding:15px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);}
  .acq-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .acq-title{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#2d5a8a;}
  .acq-tot{font-size:13px;color:var(--text-muted);font-weight:600;}
  .acq-tot b{color:#2d5a8a;font-size:17px;}
  .acq-bar-wrap{height:6px;background:var(--border);border-radius:6px;overflow:hidden;margin-bottom:12px;}
  .acq-bar{height:100%;background:#4a7ab5;border-radius:6px;transition:width .3s;}
  .acq-ctrl{display:flex;align-items:center;gap:10px;}
  .acq-inp-wrap{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--border);border-radius:var(--rs);background:var(--bg);padding:7px 10px;}
  .acq-inp{border:none;background:transparent;font-family:inherit;font-size:18px;font-weight:700;color:var(--text);width:70px;text-align:center;outline:none;}
  .acq-unit{font-size:12px;color:var(--text-dim);}
  .acq-btn{width:42px;height:42px;border-radius:50%;border:none;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit;}
  .acq-btn.minus{background:var(--surface2);color:var(--text-muted);}
  .acq-btn.plus{background:#4a7ab5;color:white;}
  .acq-note{font-size:11px;color:var(--text-dim);text-align:center;margin-top:9px;}
  .acq-ok{font-size:12px;font-weight:600;color:#3d5c3d;text-align:center;margin-top:6px;display:none;}

  .egopt{border:1px solid var(--border);background:var(--surface);border-radius:var(--rs);margin-bottom:4px;overflow:hidden;}
  .egopt.ck{border-color:#9ab89a;background:rgba(90,122,90,.12);}
  .eghead{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .egcircle{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--text-dim);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .egopt.ck .egcircle{background:var(--check);border-color:var(--check);}
  .egopt.ck .egcircle::after{content:'';width:5px;height:9px;border:2px solid #f4f0e8;border-top:none;border-left:none;transform:rotate(45deg) translateY(-1px);display:block;}
  .egname{font-size:14px;color:var(--text-muted);flex:1;}
  .egopt.ck .egname{color:var(--text);}
  .eggr{display:flex;align-items:center;gap:3px;border:1px solid var(--border);border-radius:6px;background:var(--bg);padding:3px 6px;}
  .eggr input{border:none;background:transparent;font-family:inherit;font-size:14px;font-weight:600;color:var(--text);width:42px;text-align:right;outline:none;}
  .eggr .u{font-size:11px;color:var(--text-dim);}
  .egstep{width:24px;height:24px;border-radius:50%;border:1px solid var(--border);background:var(--bg);color:var(--text-muted);font-size:14px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .egmac{font-size:11px;color:var(--text-dim);padding:0 12px 8px 40px;}
  .egvars{padding:0 12px 10px 40px;display:flex;flex-direction:column;gap:3px;}
  .egvar{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:6px;border:1px solid #c8c2b6;background:rgba(255,255,255,.4);cursor:pointer;}
  .egvar.sel{background:rgba(90,122,90,.15);border-color:#7a9a7a;}
  .egvdot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--text-dim);flex-shrink:0;}
  .egvar.sel .egvdot{background:var(--check);border-color:var(--check);}
  .egvtxt{font-size:13px;color:var(--text-muted);flex:1;}
  .egvar.sel .egvtxt{color:var(--text);}
  .egvmac{font-size:10px;color:var(--text-dim);}

  .extra{margin:22px 16px 8px;padding:15px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);}
  .extra-title{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8a4a1a;margin-bottom:4px;}
  .extra-sub{font-size:11px;color:var(--text-dim);margin-bottom:12px;}
  .extra-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .extra-name{flex:1;min-width:0;border:1px solid var(--border);border-radius:6px;background:var(--bg);font-family:inherit;font-size:13px;color:var(--text);padding:6px 8px;outline:none;}
  .extra-name::placeholder{color:var(--text-dim);}
  .extra-m{width:48px;border:1px solid var(--border);border-radius:6px;background:var(--bg);font-family:inherit;font-size:13px;font-weight:600;color:var(--text);padding:6px 3px;outline:none;text-align:center;}
  .extra-m::placeholder{color:var(--text-dim);font-weight:400;}
  .extra-hdr{display:flex;gap:6px;margin-bottom:4px;padding-left:2px;}
  .extra-hdr .lbln{flex:1;}
  .extra-hdr .lblm{width:48px;text-align:center;font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-dim);}

  .meal-head{cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:11px 13px;margin-bottom:0;-webkit-tap-highlight-color:transparent;}
  .meal-head.open{border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0;}
  .meal-chev{font-size:13px;color:var(--text-dim);transition:transform .2s;margin-left:6px;flex-shrink:0;}
  .meal-head.open .meal-chev{transform:rotate(90deg);}
  .meal-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
  .meal-body{border:1px solid var(--border);border-top:none;border-bottom-left-radius:var(--rs);border-bottom-right-radius:var(--rs);padding:12px 13px 4px;margin-bottom:0;}
  .meal-done{font-size:10px;color:#3d5c3d;font-weight:700;background:rgba(90,122,90,.14);padding:2px 7px;border-radius:10px;margin-left:4px;}

  .step-sel{display:flex;gap:5px;margin-bottom:6px;}
  .step-btn2{flex:1;padding:6px 3px;border-radius:var(--rs);border:1px solid var(--border);background:var(--surface);color:var(--text-muted);font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;text-align:center;}
  .step-btn2.sel{background:rgba(196,122,58,.15);border-color:#c47a3a;color:#8a4a1a;}

  .vdrop-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border:1px solid var(--border);background:var(--surface);border-radius:var(--rs);cursor:pointer;-webkit-tap-highlight-color:transparent;margin-bottom:4px;}
  .vdrop-head.open{border-bottom-left-radius:0;border-bottom-right-radius:0;}
  .vdrop-title{font-size:13px;color:var(--text-muted);font-weight:600;}
  .vdrop-count{font-size:11px;color:#3d5c3d;font-weight:700;background:rgba(90,122,90,.14);padding:2px 7px;border-radius:10px;}
  .vdrop-chev{font-size:12px;color:var(--text-dim);transition:transform .2s;}
  .vdrop-head.open .vdrop-chev{transform:rotate(90deg);}
  .vdrop-body{border:1px solid var(--border);border-top:none;border-bottom-left-radius:var(--rs);border-bottom-right-radius:var(--rs);padding:8px;margin-bottom:4px;}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-top"><span class="app-title">Dieta</span><button class="reset-btn" onclick="resetDay()">Reset giorno</button></div>
  <div class="step-sel">
    <button class="step-btn2" id="stp-1" onclick="setStep('1')">Step 1</button>
    <button class="step-btn2" id="stp-2" onclick="setStep('2')">Step 2</button>
    <button class="step-btn2" id="stp-3" onclick="setStep('3')">Step 3</button>
    <button class="step-btn2" id="stp-4" onclick="setStep('4')">Step 4</button>
    <button class="step-btn2" id="stp-refeed" onclick="setStep('refeed')">Refeed</button>
    <button class="step-btn2" id="stp-minicut" onclick="setStep('minicut')" style="background:rgba(180,72,95,.12);border-color:#b4485f;color:#8a2a3f">Minicut</button>
    <button class="step-btn2" id="stp-mant" onclick="setStep('mant')" style="background:rgba(14,124,134,.1);border-color:#0e7c86;color:#0a5a62">Mantenim.</button>
  </div>
  <div class="day-sel">
    <button class="day-btn" id="btn-on" onclick="setDay('on')">ON<br><span style="font-size:10px;font-weight:400">allenamento</span></button>
    <button class="day-btn" id="btn-off" onclick="setDay('off')">OFF<br><span style="font-size:10px;font-weight:400">riposo</span></button>
    <button class="day-btn" id="btn-scarico" onclick="setDay('scarico')" style="display:none">SCARICO<br><span style="font-size:10px;font-weight:400">no carbo</span></button>
  </div>
</div>
<div class="totali" id="totali"></div>
<div class="prog-wrap"><div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div><span class="prog-lbl" id="progLbl">0 / 0</span></div>
<div class="content" id="content"></div>
<div class="extra">
  <div class="extra-title">Extra / Cena cheat</div>
  <div class="extra-sub">Alimenti fuori dieta: inserisci i valori a mano, entrano nel totale in alto.</div>
  <div class="extra-hdr"><span class="lbln"></span><span class="lblm">kcal</span><span class="lblm">C</span><span class="lblm">P</span><span class="lblm">G</span></div>
  <div id="extraRows"></div>
</div>
<div class="acqua">
  <div class="acq-hdr"><span class="acq-title">Acqua</span><span class="acq-tot"><b id="acqMl">0</b> / 3250 ml <span id="acqPct" style="color:#4a7ab5;font-weight:700">(0%)</span></span></div>
  <div class="acq-bar-wrap"><div class="acq-bar" id="acqBar" style="width:0%"></div></div>
  <div class="acq-ctrl">
    <button class="acq-btn minus" onclick="acqChange(-1)">-</button>
    <div class="acq-inp-wrap"><input class="acq-inp" id="acqQty" type="number" value="300" min="50" max="1000" step="50"><span class="acq-unit">ml</span></div>
    <button class="acq-btn plus" onclick="acqChange(1)">+</button>
  </div>
  <div class="acq-note" id="acqNote">Obiettivo: 3250 ml</div>
  <div class="acq-ok" id="acqOk"></div>
</div>

function stepFromDate(){
  var t=new Date(); var y=t.getFullYear(), mo=t.getMonth()+1, dd=t.getDate();
  function inR(m1,d1,m2,d2){ var a=(mo>m1)||(mo===m1&&dd>=d1); var b=(mo<m2)||(mo===m2&&dd<=d2); return a&&b; }
  if(y!==2026) return null;
  // refeed days
  if((mo===8&&(dd===3||dd===4||dd===8))) return 'refeed';
  if(inR(8,3,8,10)) return '1';
  if(inR(8,14,8,19)) return '2';
  if(inR(8,27,9,4)) return '3';
  if(inR(9,13,9,20)) return '4';
  return null; // vacanze o fuori piano: nessun suggerimento
}

}

function countCk(){
  var day=curMenu(),total=0,done=0;
  day.pasti.forEach(function(p){
    var s=gs(curDay,p.id);
    catList(p,s).forEach(function(cat,ci){
      if(cat.tipo==='radio'){ total++; if(cat.opts.some(function(_,oi){return s.ck['c'+ci+'_'+oi];}))done++; }
      else if(cat.tipo==='grams'){ total++; if(cat.items.some(function(_,ii){return s.ck['g'+ci+'_'+ii];}))done++; }
      else { cat.opts.forEach(function(_,oi){ total++; if(s.ck['c'+ci+'_'+oi])done++; }); }
    });
    if(p.pw){ total++; if(s.ck['pw'])done++; }
  });
  return {total:total,done:done};
}

function updateTotals(){
  var day=curMenu();
  var gtot=[0,0,0,0];
  day.pasti.forEach(function(p){ gtot=addM(gtot,mealMacros(p,gs(curDay,p.id))); });
  var ex=extraTotals(); gtot=[gtot[0]+ex[0],Math.round((gtot[1]+ex[1])*10)/10,Math.round((gtot[2]+ex[2])*10)/10,Math.round((gtot[3]+ex[3])*10)/10];
  var T=(TARGETS[curStep]&&TARGETS[curStep][curDay])?TARGETS[curStep][curDay]:[0,0,0,0]; var labels=['Calorie','Carb','Prot','Grassi'],units=['','g','g','g'];
  var h='<div class="totali-row">';
  for(var i=0;i<4;i++){ var over=gtot[i]>T[i]*1.05?' over':''; h+='<div class="tot-card"><div class="tot-val'+over+'">'+gtot[i]+units[i]+'</div><div class="tot-lbl">'+labels[i]+'</div><div class="tot-target">/ '+T[i]+units[i]+'</div></div>'; }
  h+='</div>';
  document.getElementById('totali').innerHTML=h;
  // update meal subtitles live (without full re-render) handled in render
}

function curMenu(){ return D[curDay] || D['off'] || D['on']; }
function render(){ saveST();
  ['on','off','scarico'].forEach(function(d){ var b=document.getElementById('btn-'+d); if(b){ b.className='day-btn'+(d===curDay?' '+(d==='scarico'?'sc':d):''); } });
  ['1','2','3','4','refeed','minicut','mant'].forEach(function(st){ var b=document.getElementById('stp-'+st); if(b){ b.classList.toggle('sel', st===curStep); } });
  // mostra/nascondi il pulsante Scarico (solo Minicut)
  var scBtn=document.getElementById('btn-scarico');
  if(scBtn) scBtn.style.display = (curStep==='minicut')?'':'none';
  var day=curMenu();
  updateTotals();
  var r=countCk();
  document.getElementById('progFill').style.width=(r.total?Math.round(r.done/r.total*100):0)+'%';
  document.getElementById('progLbl').textContent=r.done+' / '+r.total;

  var c='';
  day.pasti.forEach(function(p,pi){
    var s=gs(curDay,p.id);
    var mm=mealMacros(p,s);
    var isOpen=!!OPENM[p.id];
    c+='<div class="meal-sec"><div class="meal-head'+(isOpen?' open':'')+'" onclick="toggleMeal(\''+p.id+'\')"><div class="meal-left"><span class="meal-lbl '+p.type+'">'+p.nome+'</span>';
    if(mm[0]>0) c+='<span class="meal-done">'+mm[0]+' kcal</span>';
    c+='</div>';
    if(mm[0]>0) c+='<span class="meal-sub"><b>'+mm[0]+'</b> · C '+mm[1]+' · P '+mm[2]+' · G '+mm[3]+'</span>';
    c+='<span class="meal-chev">&#9654;</span></div>';
    if(isOpen){
      c+='<div class="meal-body">';
      if(p.note) c+='<div class="sec-note">'+p.note+'</div>';
      if(p.alt){
        c+='<div class="alt-tabs">';
        p.alt.forEach(function(a,ai){ c+='<button class="alt-tab'+(s.ai===ai?' sel':'')+'" onclick="setAlt(\''+curDay+'\',\''+p.id+'\','+ai+')">'+a.nome+'</button>'; });
        c+='</div>';
        c+=renderCats(p.alt[s.ai].cats,p.id,s);
      } else { c+=renderCats(p.cats,p.id,s); }
      if(p.pw){ var pwc=s.ck['pw']?' ck':''; c+='<div class="pw-badge">POST WORKOUT</div><div class="fix'+pwc+'" onclick="togglePW(\''+curDay+'\',\''+p.id+'\')"><div class="fix-box"></div><div style="flex:1"><div class="fix-txt">'+p.pw+'</div>'+(p.pwm?'<div class="fix-macros">'+fmtM(p.pwm)+'</div>':'')+'</div></div>'; }
      c+='</div>';
    }
    c+='</div>';
  });
  document.getElementById('content').innerHTML=c;
}


// default effettivo: se pranzo/cena e c'è un valore di step, usalo; altrimenti opt.def/defn
function effDef(pid, opt){
  if((pid==='pra'||pid==='cen') && opt.l){
    var sd = stepDef(pid, opt.l==='Legumi'?'Legumi':opt.l);
    if(sd!==null) return sd;
  }
  return opt.def!==undefined?opt.def:opt.defn;
}

function renderCats(cats,pid,s){
  var h='';
  cats.forEach(function(cat,ci){
    h+='<div class="cat-block">';
    if(cat.nome && !cat.collapsible) h+='<div class="cat-lbl">'+cat.nome+'</div>';
    if(cat.tipo==='radio'){
      cat.opts.forEach(function(opt,oi){
        var ck=s.ck['c'+ci+'_'+oi];
        if(opt.eg){
          var g=s.gr['e'+ci+'_'+oi]!==undefined?s.gr['e'+ci+'_'+oi]:effDef(pid,opt);
          var mm=null;
          if(ck){ if(opt.single){ mm=scaleM(opt.per,g); } else { var vi=s.vr['v'+ci+'_'+oi]; if(vi!==undefined&&opt.variants[vi]) mm=scaleM(opt.variants[vi].per,g); } }
          h+='<div class="egopt'+(ck?' ck':'')+'">';
          h+='<div class="eghead" onclick="egToggle(\''+curDay+'\',\''+pid+'\','+ci+','+oi+')"><div class="egcircle"></div><div class="egname">'+opt.l+'</div>';
          h+='<div class="eggr"><button class="egstep" onclick="egStep(\''+curDay+'\',\''+pid+'\','+ci+','+oi+',-'+(opt.step||5)+','+effDef(pid,opt)+',event)">-</button><input type="number" value="'+g+'" onfocus="egSel(\''+curDay+'\',\''+pid+'\','+ci+','+oi+')" oninput="egSetG(\''+curDay+'\',\''+pid+'\','+ci+','+oi+',this.value)"><span class="u">g</span><button class="egstep" onclick="egStep(\''+curDay+'\',\''+pid+'\','+ci+','+oi+',+'+(opt.step||5)+','+effDef(pid,opt)+',event)">+</button></div>';
          h+='</div>';
          if(mm) h+='<div class="egmac">'+fmtM(mm)+'</div>';
          if(!opt.single&&ck){
            h+='<div class="egvars">';
            opt.variants.forEach(function(v,vi){ var sel=s.vr['v'+ci+'_'+oi]===vi; var vm=scaleM(v.per,g); h+='<div class="egvar'+(sel?' sel':'')+'" onclick="egPickVar(\''+curDay+'\',\''+pid+'\','+ci+','+oi+','+vi+',event)"><div class="egvdot"></div><div class="egvtxt">'+v.l+'</div><div class="egvmac">'+vm[0]+' kcal · P '+vm[2]+'</div></div>'; });
            h+='</div>';
          }
          h+='</div>';
        } else if(opt.cnt){
          var n=s.gr['e'+ci+'_'+oi]!==undefined?s.gr['e'+ci+'_'+oi]:effDef(pid,opt);
          var mm=ck?[Math.round(opt.per[0]*n),Math.round(opt.per[1]*n*10)/10,Math.round(opt.per[2]*n*10)/10,Math.round(opt.per[3]*n*10)/10]:null;
          h+='<div class="egopt'+(ck?' ck':'')+'">';
          h+='<div class="eghead" onclick="egToggle(\''+curDay+'\',\''+pid+'\','+ci+','+oi+')"><div class="egcircle"></div><div class="egname">'+opt.l+'</div>';
          h+='<div class="eggr"><button class="egstep" onclick="egStep(\''+curDay+'\',\''+pid+'\','+ci+','+oi+',-1,'+effDef(pid,opt)+',event)">-</button><input type="number" value="'+n+'" onfocus="egSel(\''+curDay+'\',\''+pid+'\','+ci+','+oi+')" oninput="egSetG(\''+curDay+'\',\''+pid+'\','+ci+','+oi+',this.value)"><span class="u">'+opt.unit+'</span><button class="egstep" onclick="egStep(\''+curDay+'\',\''+pid+'\','+ci+','+oi+',1,'+effDef(pid,opt)+',event)">+</button></div>';
          h+='</div>';
          if(mm) h+='<div class="egmac">'+fmtM(mm)+'</div>';
          h+='</div>';
        } else {
        var ck2=s.ck['c'+ci+'_'+oi];
        h+='<div class="opt'+(ck2?' ck':'')+'" onclick="radioSel(\''+curDay+'\',\''+pid+'\','+ci+','+oi+')"><div class="opt-circle"></div><div class="opt-text"><div>'+opt.l+'</div>';
        if(opt.m&&!opt.sub) h+='<div class="opt-macros">'+fmtM(opt.m)+'</div>';
        if(opt.sub&&ck2){
          h+='<div class="sub-list">';
          opt.sub.forEach(function(sb,si){ var sc=s.ck['s'+ci+'_'+oi+'_'+si]; h+='<div class="sub'+(sc?' ck':'')+'" onclick="toggleSub(\''+curDay+'\',\''+pid+'\','+ci+','+oi+','+si+',event)"><div class="sub-box"></div><div class="sub-txt">'+sb.l+'</div>'+(sb.m?'<div class="sub-macros">'+sb.m[0]+' kcal · P '+sb.m[2]+'</div>':'')+'</div>'; });
          h+='</div>';
        }
        h+='</div></div>';
        }
      });
    } else if(cat.tipo==='grams'){
      var mgHtml='';
      var selCount=0;
      cat.items.forEach(function(it,ii){
        var k='g'+ci+'_'+ii; var ck=s.ck[k]; var g=s.gr[k]!==undefined?s.gr[k]:cat.def;
        if(ck)selCount++;
        var mm = ck ? scaleM(it.per,g) : null;
        mgHtml+='<div class="mg'+(ck?' ck':'')+'">';
        mgHtml+='<div class="mg-box" onclick="toggleMG(\''+curDay+'\',\''+pid+'\','+ci+','+ii+')"></div>';
        mgHtml+='<div class="mg-name" onclick="toggleMG(\''+curDay+'\',\''+pid+'\','+ci+','+ii+')">'+it.l+(mm?'<div class="mg-macros" style="text-align:left;margin-top:2px">'+mm[0]+' kcal · C '+mm[1]+' · P '+mm[2]+'</div>':'')+'</div>';
        mgHtml+='<div class="mg-gr"><button class="step-btn" style="width:24px;height:24px;font-size:14px" onclick="stepGR(\''+curDay+'\',\''+pid+'\','+ci+','+ii+',-5,'+cat.def+',event)">-</button>';
        mgHtml+='<input class="mg-input" type="number" value="'+g+'" onfocus="if(!'+(''+!!ck)+')toggleMG(\''+curDay+'\',\''+pid+'\','+ci+','+ii+')" oninput="setGR(\''+curDay+'\',\''+pid+'\','+ci+','+ii+',this.value)"><span class="mg-unit">g</span>';
        mgHtml+='<button class="step-btn" style="width:24px;height:24px;font-size:14px" onclick="stepGR(\''+curDay+'\',\''+pid+'\','+ci+','+ii+',5,'+cat.def+',event)">+</button></div>';
        mgHtml+='</div>';
      });
      if(cat.collapsible){
        var vkey=pid+'_'+ci; var vopen=!!VOPEN[vkey];
        h+='<div class="vdrop-head'+(vopen?' open':'')+'" onclick="toggleVdrop(\''+vkey+'\')"><span class="vdrop-title">Scegli '+(cat.nome&&cat.nome.toLowerCase().indexOf('frutta')>=0?'frutta':(cat.nome&&cat.nome.toLowerCase().indexOf('legumi')>=0?'legumi':'verdure'))+'</span><span style="display:flex;align-items:center;gap:8px">'+(selCount>0?'<span class="vdrop-count">'+selCount+' sel.</span>':'')+'<span class="vdrop-chev">&#9654;</span></span></div>';
        if(vopen) h+='<div class="vdrop-body">'+mgHtml+'</div>';
      } else {
        h+=mgHtml;
      }
    } else {
      cat.opts.forEach(function(opt,oi){ var ck=s.ck['c'+ci+'_'+oi]; h+='<div class="fix'+(ck?' ck':'')+'" onclick="toggleFix(\''+curDay+'\',\''+pid+'\',\'c'+ci+'_'+oi+'\')"><div class="fix-box"></div><div style="flex:1"><div class="fix-txt">'+opt.l+'</div>'+(opt.m?'<div class="fix-macros">'+fmtM(opt.m)+'</div>':'')+'</div></div>'; });
    }
    h+='</div>';
  });
  return h;
}

var acqTot=0,ACQ_TARGET=3250;
var OPENM={};
var VOPEN={};
var EXTRA=[{n:'',k:'',c:'',p:'',f:''},{n:'',k:'',c:'',p:'',f:''},{n:'',k:'',c:'',p:'',f:''},{n:'',k:'',c:'',p:'',f:''},{n:'',k:'',c:'',p:'',f:''},{n:'',k:'',c:'',p:'',f:''},{n:'',k:'',c:'',p:'',f:''},{n:'',k:'',c:'',p:'',f:''},{n:'',k:'',c:'',p:'',f:''},{n:'',k:'',c:'',p:'',f:''}];
function extraTotals(){ var t=[0,0,0,0]; EXTRA.forEach(function(r){ t[0]+=parseFloat(r.k)||0; t[1]+=parseFloat(r.c)||0; t[2]+=parseFloat(r.p)||0; t[3]+=parseFloat(r.f)||0; }); return [Math.round(t[0]),Math.round(t[1]*10)/10,Math.round(t[2]*10)/10,Math.round(t[3]*10)/10]; }
function toggleVdrop(pid){ VOPEN[pid]=!VOPEN[pid]; saveST(); render(); }
function toggleMeal(id){ OPENM[id]=!OPENM[id]; saveST(); render(); }
function setExtra(i,field,v){ EXTRA[i][field]=v; saveST(); updateTotals(); }
function renderExtra(){ var h=''; for(var i=0;i<10;i++){ var r=EXTRA[i]; h+='<div class="extra-row"><input class="extra-name" type="text" value="'+(r.n||'').replace(/"/g,'&quot;')+'" placeholder="Alimento extra..." oninput="setExtra('+i+',\'n\',this.value)"><input class="extra-m" type="number" value="'+(r.k||'')+'" placeholder="0" oninput="setExtra('+i+',\'k\',this.value)"><input class="extra-m" type="number" value="'+(r.c||'')+'" placeholder="0" oninput="setExtra('+i+',\'c\',this.value)"><input class="extra-m" type="number" value="'+(r.p||'')+'" placeholder="0" oninput="setExtra('+i+',\'p\',this.value)"><input class="extra-m" type="number" value="'+(r.f||'')+'" placeholder="0" oninput="setExtra('+i+',\'f\',this.value)"></div>'; } document.getElementById('extraRows').innerHTML=h; }

function acqChange(sg){ var inp=document.getElementById('acqQty'); var q=parseInt(inp.value)||300; acqTot=Math.max(0,acqTot+sg*q); inp.value=q; renderAcq(); }
function renderAcq(){ saveST(); var pct=Math.round(acqTot/ACQ_TARGET*100); var pctBar=Math.min(100,pct); document.getElementById('acqMl').textContent=acqTot; document.getElementById('acqBar').style.width=pctBar+'%'; var pe=document.getElementById('acqPct'); if(pe)pe.textContent='('+pct+'%)'; var n=document.getElementById('acqNote'),ok=document.getElementById('acqOk'); if(acqTot>=ACQ_TARGET){n.style.display='none';ok.style.display='block';ok.textContent='Obiettivo raggiunto! '+pct+'% ('+acqTot+' ml)';}else{n.style.display='block';n.textContent='Mancano '+(ACQ_TARGET-acqTot)+' ml — '+pct+'% completato';ok.style.display='none';} }

var jsMap={0:'on',1:'off',2:'on',3:'off',4:'on',5:'off',6:'on'};
var _hadSave=false; try{ _hadSave=!!localStorage.getItem(SKEY); }catch(e){}

// frutta in merenda OFF (serve agli step alti)
(function(){
  var mer = D.off.pasti.filter(function(p){return p.id==='mer';})[0];
  if(mer && !mer.cats.some(function(c){return c.nome && c.nome.indexOf('Frutta')===0;}))
    mer.cats.push({ nome:'Frutta', tipo:'grams', def:150, items:FRUTTA, collapsible:1 });
})();

loadST();
var _autoStep=stepFromDate(); if(_autoStep)curStep=_autoStep;
if(!_hadSave){ curDay=jsMap[new Date().getDay()]; }
render(); renderAcq(); renderExtra();
</script>
