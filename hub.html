<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Il mio piano</title>
<style>
  :root{
    --bg:#f4f0e8; --tabbar:#ffffff; --border:#d5cfc3;
    --dieta:#5a7a5a; --spesa:#4a7ab5; --piano:#c8791a;
    --text:#2a2a24; --text-dim:#9a9a8a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);
    display:flex;flex-direction:column;
  }
  /* TAB BAR */
  .tabbar{
    display:flex;
    background:var(--tabbar);
    border-bottom:1px solid var(--border);
    padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;
    gap:6px;
    flex-shrink:0;
    z-index:10;
  }
  .tab{
    flex:1;
    border:1px solid var(--border);
    background:#f4f0e8;
    border-radius:10px;
    padding:9px 4px;
    font-family:inherit;
    font-size:12px;
    font-weight:700;
    letter-spacing:.04em;
    color:var(--text-dim);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    transition:all .15s;
    -webkit-tap-highlight-color:transparent;
    position:relative;
  }
  .tab .ic{font-size:17px;line-height:1;}
  .tab.active{color:var(--text);}
  .tab.dieta.active{background:rgba(90,122,90,.15);border-color:var(--dieta);color:#3d5c3d;}
  .tab.spesa.active{background:rgba(74,122,181,.15);border-color:var(--spesa);color:#2d5a8a;}
  .tab.piano.active{background:rgba(200,121,26,.16);border-color:var(--piano);color:#8a4a1a;}

  /* Piano tab always draws attention when NOT active */
  .tab.piano:not(.active){
    border-color:var(--piano);
    color:var(--piano);
    background:rgba(200,121,26,.07);
    animation:pianoPulse 2.4s ease-in-out infinite;
  }
  @keyframes pianoPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(200,121,26,.0);}
    50%{box-shadow:0 0 0 3px rgba(200,121,26,.22);}
  }
  .tab.piano .star{
    position:absolute;top:4px;right:6px;font-size:9px;
  }

  /* FRAMES */
  .frames{flex:1;position:relative;min-height:0;}
  iframe{
    position:absolute;inset:0;
    width:100%;height:100%;
    border:0;
    display:none;
    background:var(--bg);
  }
  iframe.show{display:block;}
  @media (prefers-reduced-motion:reduce){
    .tab.piano:not(.active){animation:none;}
  }
</style>
</head>
<body>

<div class="tabbar">
  <button class="tab piano" id="tab-piano" onclick="showTab('piano')">
    <span class="ic">📋</span>Piano<span class="star">★</span>
  </button>
  <button class="tab dieta active" id="tab-dieta" onclick="showTab('dieta')">
    <span class="ic">🍽️</span>Dieta
  </button>
  <button class="tab spesa" id="tab-spesa" onclick="showTab('spesa')">
    <span class="ic">🛒</span>Spesa
  </button>
</div>

<div class="frames">
  <iframe id="fr-piano" data-src="piano.html?v=1"></iframe>
  <iframe id="fr-dieta" class="show" src="dieta_hub.html?v=1"></iframe>
  <iframe id="fr-spesa" data-src="spesa.html?v=1"></iframe>
</div>

<script>
  var loaded = { dieta:true, piano:false, spesa:false };

  function showTab(name){
    ['piano','dieta','spesa'].forEach(function(n){
      document.getElementById('tab-'+n).classList.toggle('active', n===name);
      document.getElementById('fr-'+n).classList.toggle('show', n===name);
    });
    // lazy-load iframes on first open
    if(!loaded[name]){
      var fr=document.getElementById('fr-'+name);
      fr.src=fr.getAttribute('data-src');
      loaded[name]=true;
    }
  }
</script>
</body>
</html>
